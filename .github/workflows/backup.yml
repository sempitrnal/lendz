name: Daily Database Backup

on:
  schedule:
    - cron: "0 18 * * *" # runs 2AM Manila time (UTC+8) daily
  workflow_dispatch: # allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          supabase db dump \
            --db-url "postgresql://postgres.ktgfpxmjvfxvukaemnhj@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres" \
            -f backup-$(date +%Y-%m-%d).sql

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.sql"
          retention-days: 30
